<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shower Silicone Job - Learn a Trade</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            overflow-x: hidden;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 0.8; }
            50% { transform: scale(1.05); opacity: 1; }
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-20px); }
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        .flyer {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 30px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            animation: slideIn 0.8s ease-out;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .main-title {
            font-size: 3.5rem;
            font-weight: 900;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 10px;
            animation: pulse 2s ease-in-out infinite;
        }

        .subtitle {
            font-size: 1.8rem;
            color: #4a5568;
            font-weight: 600;
            margin-bottom: 20px;
        }

        .tag-line {
            font-size: 1.2rem;
            color: #718096;
            font-style: italic;
        }

        .perks-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin: 40px 0;
        }

        .perk-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 25px;
            border-radius: 20px;
            color: white;
            text-align: center;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            cursor: pointer;
        }

        .perk-card:hover {
            transform: translateY(-10px) scale(1.05);
            box-shadow: 0 15px 40px rgba(102, 126, 234, 0.4);
        }

        .perk-icon {
            font-size: 3rem;
            margin-bottom: 15px;
        }

        .perk-title {
            font-size: 1.3rem;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .perk-desc {
            font-size: 1rem;
            opacity: 0.9;
        }

        .before-after-section {
            margin: 50px 0;
            text-align: center;
        }

        .section-title {
            font-size: 2.5rem;
            font-weight: 800;
            color: #2d3748;
            margin-bottom: 30px;
        }

        .image-comparison {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            margin-top: 30px;
        }

        .image-box {
            position: relative;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            transition: transform 0.3s ease;
        }

        .image-box:hover {
            transform: scale(1.05);
        }

        .image-box img {
            width: 100%;
            height: 350px;
            object-fit: cover;
        }

        .image-label {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 15px;
            font-size: 1.3rem;
            font-weight: 700;
        }

        .before-label {
            background: rgba(239, 68, 68, 0.9);
        }

        .after-label {
            background: rgba(16, 185, 129, 0.9);
        }

        .cta-section {
            text-align: center;
            margin-top: 50px;
            padding: 40px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 25px;
            color: white;
        }

        .cta-title {
            font-size: 2.5rem;
            font-weight: 800;
            margin-bottom: 20px;
        }

        .phone-number {
            font-size: 3rem;
            font-weight: 900;
            margin: 30px 0;
            letter-spacing: 3px;
            animation: pulse 2s ease-in-out infinite;
        }

        .cta-button {
            display: inline-block;
            background: white;
            color: #667eea;
            padding: 20px 50px;
            border-radius: 50px;
            font-size: 1.5rem;
            font-weight: 800;
            text-decoration: none;
            transition: all 0.3s ease;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        .cta-button:hover {
            transform: scale(1.1);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.3);
        }

        .requirements {
            margin-top: 30px;
            font-size: 1.2rem;
            opacity: 0.95;
        }

        @media (max-width: 768px) {
            .main-title {
                font-size: 2.5rem;
            }
            .subtitle {
                font-size: 1.4rem;
            }
            .image-comparison {
                grid-template-columns: 1fr;
            }
            .phone-number {
                font-size: 2rem;
            }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        function SiliconeFlyerApp() {
            const [isVisible, setIsVisible] = useState(false);

            useEffect(() => {
                setIsVisible(true);
            }, []);

            const perks = [
                {
                    icon: "💰",
                    title: "Great Pay Per Job",
                    desc: "Earn solid money for each project completed"
                },
                {
                    icon: "🎓",
                    title: "Learn On The Job",
                    desc: "I'll teach you everything - no experience needed!"
                },
                {
                    icon: "🚗",
                    title: "Car Supplied",
                    desc: "Vehicle provided for work - no transport worries"
                },
                {
                    icon: "⏰",
                    title: "Casual On-Call",
                    desc: "Flexible hours that work around your schedule"
                },
                {
                    icon: "🛠️",
                    title: "Trade Skill",
                    desc: "Learn a valuable skill you can use forever"
                },
                {
                    icon: "📍",
                    title: "Local Work",
                    desc: "Must live locally - work close to home"
                }
            ];

            return (
                <div className="container">
                    <div className="flyer">
                        <div className="header">
                            <h1 className="main-title">WANTED</h1>
                            <h2 className="subtitle">Silicone/Caulker Position Available</h2>
                            <p className="tag-line">Learn a skill that pays for life 🔧</p>
                        </div>

                        <div className="perks-grid">
                            {perks.map((perk, index) => (
                                <div
                                    key={index}
                                    className="perk-card"
                                    style={{
                                        animationDelay: `${index * 0.1}s`
                                    }}
                                >
                                    <div className="perk-icon">{perk.icon}</div>
                                    <div className="perk-title">{perk.title}</div>
                                    <div className="perk-desc">{perk.desc}</div>
                                </div>
                            ))}
                        </div>

                        <div className="before-after-section">
                            <h3 className="section-title">The Work You'll Master 🚿</h3>
                            <p style={{fontSize: '1.2rem', color: '#4a5568', marginBottom: '20px'}}>
                                Transform old, moldy shower silicone into pristine, waterproof seals
                            </p>
                            <div className="image-comparison">
                                <div className="image-box">
                                    <img src="before.jpg" alt="Before - Old Silicone" id="before-img" />
                                    <div className="image-label before-label">❌ BEFORE - Old & Moldy</div>
                                </div>
                                <div className="image-box">
                                    <img src="after.jpg" alt="After - New Silicone" id="after-img" />
                                    <div className="image-label after-label">✅ AFTER - Fresh & Clean</div>
                                </div>
                            </div>
                        </div>

                        <div className="cta-section">
                            <h3 className="cta-title">Ready to Learn a Trade?</h3>
                            <p style={{fontSize: '1.3rem', marginBottom: '10px'}}>
                                I'll personally train you - no experience required!
                            </p>
                            <div className="phone-number">📱 0417 035 368</div>
                            <a href="tel:0417035368" className="cta-button">
                                CALL CHRIS NOW
                            </a>
                            <div className="requirements">
                                <p>✓ Must live locally</p>
                                <p>✓ Reliable & ready to learn</p>
                                <p>✓ Start earning while you learn</p>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        ReactDOM.render(<SiliconeFlyerApp />, document.getElementById('root'));
    </script>

    <script>
        // Generate before/after images using canvas
        function createShowerImage(isAfter) {
            const canvas = document.createElement('canvas');
            canvas.width = 800;
            canvas.height = 600;
            const ctx = canvas.getContext('2d');

            // Base shower tile background
            ctx.fillStyle = '#e8e8e8';
            ctx.fillRect(0, 0, 800, 600);

            // Draw tiles
            ctx.strokeStyle = '#c0c0c0';
            ctx.lineWidth = 2;
            for (let i = 0; i < 800; i += 100) {
                ctx.beginPath();
                ctx.moveTo(i, 0);
                ctx.lineTo(i, 600);
                ctx.stroke();
            }
            for (let i = 0; i < 600; i += 100) {
                ctx.beginPath();
                ctx.moveTo(0, i);
                ctx.lineTo(800, i);
                ctx.stroke();
            }

            // Draw shower base/wall junction
            if (isAfter) {
                // Clean, new silicone - bright white
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(0, 500, 800, 100);

                // Perfect silicone bead
                ctx.strokeStyle = '#f0f0f0';
                ctx.lineWidth = 15;
                ctx.lineCap = 'round';
                ctx.beginPath();
                ctx.moveTo(0, 505);
                ctx.lineTo(800, 505);
                ctx.stroke();

                // Highlight effect
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.8)';
                ctx.lineWidth = 8;
                ctx.beginPath();
                ctx.moveTo(0, 502);
                ctx.lineTo(800, 502);
                ctx.stroke();
            } else {
                // Old, dirty base
                ctx.fillStyle = '#d4d4c8';
                ctx.fillRect(0, 500, 800, 100);

                // Old, discolored silicone
                ctx.strokeStyle = '#8b7355';
                ctx.lineWidth = 18;
                ctx.lineCap = 'round';
                ctx.beginPath();
                ctx.moveTo(0, 505);
                ctx.lineTo(800, 505);
                ctx.stroke();

                // Add mold spots
                ctx.fillStyle = 'rgba(50, 50, 50, 0.6)';
                for (let i = 0; i < 30; i++) {
                    const x = Math.random() * 800;
                    const y = 495 + Math.random() * 20;
                    const size = 3 + Math.random() * 8;
                    ctx.beginPath();
                    ctx.arc(x, y, size, 0, Math.PI * 2);
                    ctx.fill();
                }

                // Cracks and gaps
                ctx.strokeStyle = 'rgba(100, 70, 50, 0.8)';
                ctx.lineWidth = 2;
                for (let i = 0; i < 10; i++) {
                    const x = Math.random() * 800;
                    ctx.beginPath();
                    ctx.moveTo(x, 500);
                    ctx.lineTo(x + 5, 510);
                    ctx.stroke();
                }
            }

            return canvas.toDataURL('image/jpeg', 0.9);
        }

        // Set images once DOM is loaded
        window.addEventListener('load', () => {
            setTimeout(() => {
                const beforeImg = document.getElementById('before-img');
                const afterImg = document.getElementById('after-img');

                if (beforeImg) beforeImg.src = createShowerImage(false);
                if (afterImg) afterImg.src = createShowerImage(true);
            }, 100);
        });
    </script>
</body>
</html>
